spring.application.name=Restic Explorer

# Database - H2 (default for development)
spring.datasource.url=jdbc:h2:file:./data/restic-explorer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Thymeleaf
spring.thymeleaf.cache=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=false
management.info.build.enabled=true
management.info.java.enabled=false
management.info.os.enabled=false

# Info endpoint properties
info.app.name=${spring.application.name}

# Restic
restic.binary=restic
restic.timeout=300
restic.scan.check-interval=60000

# Server
server.port=8080

# Authentication mode: local (default) or oauth2
restic.auth.mode=local
# Optional: restrict OAuth2 login to specific providers (comma-separated registration ids).
# If empty, any configured provider is allowed.
#restic.auth.allowed-providers=keycloak,entra

# Example OAuth2 client configuration (uncomment and adapt for your provider):
#spring.security.oauth2.client.registration.keycloak.client-id=restic-explorer
#spring.security.oauth2.client.registration.keycloak.client-secret={secret}
#spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
#spring.security.oauth2.client.registration.keycloak.client-name=Keycloak
#spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
#spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
#spring.security.oauth2.client.provider.keycloak.issuer-uri=https://keycloak.example.com/realms/master
#spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# Encryption - AES key for encrypting sensitive data at rest (Base64-encoded, 32 bytes for AES-256)
# Generate with: openssl rand -base64 32
# IMPORTANT: Set this in production via environment variable RESTIC_ENCRYPTION_KEY
restic.encryption.key=${RESTIC_ENCRYPTION_KEY:}
